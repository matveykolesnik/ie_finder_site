paths:
  config_file: "ie_finder_config.yaml"
  genomes_dir: "data/genomes"
  results_dir: "results"

execution:
  conda_env: "envs/IE_finder.yaml"

annotate:
  all_candidates: false

# Same cascade as MGE_finder at the commit in UPSTREAM, without cohort deduplication,
# with two departures: attL is the best-scoring BLAST hit rather than the longest,
# and gapped attL alignments are kept. Set attl_select_by: length and
# attl_reject_gapped: true to reproduce the published rules.
filters:
  trna_max_distance_bp: 500
  v3ps_shift: 3
  attl_window_bp: 300000
  attl_candidate_min_bp: 8
  attl_exact_min_bp: 14
  attl_relaxed_min_bp: 17
  attl_reject_gapped: false
  # Which 3'-anchored BLAST hit becomes the attL: "bitscore" (best alignment)
  # or "length" (longest hit, the published rule).
  attl_select_by: bitscore
  integrase_min_aa: 300
  ie_min_nt: 0

reject_ambiguous_n_ie: false

pfam_profiles:
  - "pfam/PF00589.hmm"
  - "pfam/PF22022.hmm"
