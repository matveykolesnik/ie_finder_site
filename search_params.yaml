# Search parameters for integrative elements.
#
# ./run.sh reads this file. SEARCH_PARAMS=other.yaml ./run.sh ... layers another
# file on top of it: keys set there win, keys left out keep the values below.
# An unknown key stops the run. The report lists the values that were used.
#
# Same cascade as MGE_finder at the commit in UPSTREAM, without cohort
# deduplication, with six departures: integrase hits must reach the Pfam
# gathering threshold, integrase length leaves out the stop codon, attL is the
# best-scoring BLAST hit rather than the longest, gapped attL alignments are
# kept, the integrase may sit at the attL end of the element rather than next
# to the tRNA, and it may sit up to 700 bp from its att site rather than 500.
# Set integrase_hmm_cutoff: none, integrase_len_from: span, attl_select_by:
# length, attl_reject_gapped: true, integrase_at: trna and
# trna_max_distance_bp: 500 to reproduce the published rules.

# Which HMMER hits count as integrases: ga keeps hits at or above each Pfam
# profile's gathering threshold; none keeps every hit HMMER reports (E-value up
# to 10), as the published finder did.
integrase_hmm_cutoff: ga

# Integrase and tRNA must be on opposite strands with 3' ends at most this far apart (bp).
# With integrase_at: either, the same distance applies between the integrase 3'
# end and attL when the integrase sits at that end instead. The published finder
# used 500; 700 also takes in a Thermus albus prophage (SPbeta/PBSX-like head
# and tail genes) whose integrase faces the tRNA from 609 bp, across a small ORF.
trna_max_distance_bp: 700

# Where the integrase may sit: trna -- next to the tRNA (attR), facing it from
# the opposite strand, as the published finder required; either -- also at the
# far end, on the tRNA's strand, its 3' end facing attL. Tailless Thermus phages
# of the IN93/P23-77 kind (Matsushitaviridae) are built the second way, and the
# published rule never makes them candidates.
integrase_at: either

# Allowed offset (bp) between a BLAST hit end and the tRNA 3' end. The same
# offset absorbs indels where the exact run starts.
v3ps_shift: 3

# Region next to the tRNA searched for attL (bp). Elements longer than this are not found.
attl_window_bp: 300000

# Minimum exact run from the tRNA 3' end (bp). Shorter BLAST hits are not considered.
attl_candidate_min_bp: 8

# attL passes the length gate with an exact run of at least this many bp ...
attl_exact_min_bp: 14
# ... or with a BLAST hit at least this long, mismatches allowed.
attl_relaxed_min_bp: 17

# Reject attL alignments that contain gaps.
attl_reject_gapped: false

# Which 3'-anchored BLAST hit becomes attL: bitscore (best alignment) or
# length (longest hit, the published rule).
attl_select_by: bitscore

# Integrases of this length (aa) and shorter are rejected.
integrase_min_aa: 300
# How integrase length is measured: protein (the predicted protein, stop codon
# not counted) or span (ORF nucleotide span / 3, which counts the stop codon,
# as the published finder did).
integrase_len_from: protein

# Minimum element length (bp). 0 disables the filter.
ie_min_nt: 0

# Reject elements that contain ambiguous N bases.
reject_ambiguous_n_ie: false

# Tandems: elements integrated one after another at the same tRNA,
#   tRNA - element 1 - att copy - element 2 - att copy ...
# Each integration leaves a copy of the tRNA 3' end at the element's far end, and
# the next element can take the same site. attL is the best-scoring copy, so a
# tandem is either called as one element (the outer copy won) or loses its outer
# members (the inner copy won); their integrases sit next to a copy, not a tRNA
# gene, and are never paired. With tandem_search: true the copies from the tRNA to
# tandem_window_bp past the outermost attL are found again (the attL gates, plus
# tandem_min_att_bp and tandem_min_att_pident), and a copy becomes a junction when
# an integrase faces it as it would face the tRNA (opposite strand, 3' ends within
# trna_max_distance_bp) or, with integrase_at: either, ends the element whose
# integrase faces it from the tRNA's strand. Elements are split and added
# accordingly (scripts/tandems.py), and the tandems are written whole as well.
# tandem_search: false gives the output of the finder without it.
tandem_search: true
tandem_window_bp: 60000
tandem_min_att_bp: 30
tandem_min_att_pident: 80
