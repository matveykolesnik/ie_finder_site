# Versions are pinned: Prodigal, HMMER, Aragorn and BLAST+ decide which
# elements are found, so a rebuild must not pick up newer ones silently.
name: IE_finder_site
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.10.21
  - biopython=1.88
  - pandas=2.3.3
  - pyyaml=6.0.3
  - snakemake=7.32.4
  - prodigal=2.6.3
  - hmmer=3.4
  - aragorn=1.2.41
  - blast=2.17.0
