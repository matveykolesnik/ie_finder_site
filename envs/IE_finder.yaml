# Versions are pinned: pyrodigal, HMMER, Aragorn and BLAST+ decide which
# elements are found, so a rebuild must not pick up newer ones silently.
name: IE_finder_site
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.10.21
  - biopython=1.88
  - pandas=2.3.3
  - pyyaml=6.0.3
  - pyrodigal=3.7.1
  - hmmer=3.4
  - aragorn=1.2.41
  - blast=2.17.0
